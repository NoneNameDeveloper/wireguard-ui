name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev

      - name: go vet
        run: go vet ./...

      - name: go build
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -o /tmp/wgtray ./cmd/wgtray

      - name: smoke
        run: |
          /tmp/wgtray --version
          /tmp/wgtray --help || true
